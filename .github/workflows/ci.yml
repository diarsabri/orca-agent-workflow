name: Workflow kit checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows defaults to pwsh, which fails a step only on its last command.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Provider-free behavioral tests
        run: python -m unittest discover -s tests -q
      - name: Shared instructions and local links
        run: |
          python .agents/workflow.py check
          python scripts/check_docs.py
      - name: Publication guard
        run: python scripts/scan_public.py
      - name: Offline adoption demo
        run: python examples/offline_demo.py
