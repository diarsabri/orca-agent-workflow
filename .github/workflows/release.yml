name: Package and release
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build the sdist, then build its wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install --no-deps dist/*.whl
      - name: Match the release tag to the built distribution
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import os
          expected = "v" + version("orca-agent-workflow")
          if os.environ["GITHUB_REF_NAME"] != expected:
              raise SystemExit(f"The built distribution requires tag {expected}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  test-wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Run the suite against the installed wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import orca_agent_workflow
          runtime = Path(orca_agent_workflow.__file__).resolve().parents[1]
          env = dict(os.environ, ORCA_AGENT_WORKFLOW_RUNTIME=str(runtime))
          subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-q"], env=env, check=True)
          PYTHON

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
